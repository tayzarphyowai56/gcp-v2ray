    * `cloud-run.sh`
    * `config.json`
    * `Dockerfile`
    * Folder `.github/workflows/` အောက်မှာ `build-gcp-vless-ws.yml` (ဒါက အရေးအကြီးဆုံးပါ)။
4.  **စောင့်ကြည့်ပါ:** ဖိုင်တွေတင်ပြီးတာနဲ့ GitHub Actions (tab) မှာ ကြည့်လိုက်ရင် **"Build and Push ZERO_1011..."** ဆိုပြီး အစိမ်းရောင် အမှန်ခြစ် ပေါ်လာပါလိမ့်မယ်။ အဲ့ဒါဆိုရင် Image တက်သွားပါပြီ။
5.  **Run ပါ:** အခုမှ အစ်ကို့ရဲ့ `1011.sh` Script ကို User တွေကို ပေးသုံးလို့ ရပါပြီ။

