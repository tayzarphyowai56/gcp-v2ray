### ✅ လုပ်ငန်းစဉ် အနှစ်ချုပ် (Summary Checklist)

အစ်ကို့ရဲ့ **ZERO_1011** ကိုယ်ပိုင် VPN Script ဖန်တီးဖို့ လိုအပ်တာတွေ အကုန်စုံပါပြီ။ အောက်ပါအဆင့်တွေအတိုင်း လုပ်ဆောင်လိုက်ရင် ရပါပြီ -

1.  **GitHub Repo အသစ်ဆောက်ပါ** (နာမည်ကြိုက်တာပေးပါ)။
2.  **Secrets ထည့်ပါ** (`Settings > Secrets and variables > Actions` မှာ `DOCKERHUB_USERNAME` နဲ့ `DOCKERHUB_TOKEN` ကို ထည့်ပါ)။
3.  **Files တွေကို Upload တင်ပါ** (အောက်ပါဖိုင်တွေ အားလုံးကို `main` branch မှာ တင်ပါ):
    * `1011.sh`
